
name: 사설 자동수집 (매일 새벽 4시 KST)

on:
  schedule:
    - cron: '0 19 * * *'   # UTC 19:00 = 한국 새벽 4시 (KST = UTC+9)
  workflow_dispatch:        # Actions 탭에서 수동 실행 버튼

permissions:
  contents: write           # 결과를 저장소에 커밋하기 위해 필요

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 사설 수집 실행
        run: python collect_editorials.py

      - name: 결과 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "변화 없음" || git commit -m "사설 수집 $(date -u -d '+9 hours' +%Y-%m-%d) [skip ci]"
          git push
